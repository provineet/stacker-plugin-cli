# Devcontainer-only overlay, merged on top of ../docker-compose.yaml by
# .devcontainer/devcontainer.json. It is NOT used by a plain `docker compose up`,
# so the host-IDE Xdebug setup (client_host=host.docker.internal) is untouched.
#
# Relative paths here resolve from the project root (the parent of the FIRST
# compose file in the devcontainer.json list), hence the ./.devcontainer/ prefix.
services:
    wordpress:
        volumes:
            # Loaded after conf.d/xdebug.ini (z* sorts last), so its
            # xdebug.client_host=localhost overrides the host-IDE default.
            - ./.devcontainer/xdebug.devcontainer.ini:/usr/local/etc/php/conf.d/zz-xdebug-devcontainer.ini
