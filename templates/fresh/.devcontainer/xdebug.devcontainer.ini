; Devcontainer-only Xdebug override.
;
; The base docker-configs/xdebug.ini points Xdebug at host.docker.internal,
; which is correct for the "docker compose up + IDE on the host" workflow.
; Inside a Dev Container the VS Code server (and therefore the Xdebug listener
; on port 9003) runs *in this container*, so Xdebug must connect to localhost
; instead.
;
; This file is mounted to conf.d only via .devcontainer/docker-compose.devcontainer.yaml,
; and its name sorts AFTER xdebug.ini so PHP loads it last and this value wins.
xdebug.client_host=localhost
