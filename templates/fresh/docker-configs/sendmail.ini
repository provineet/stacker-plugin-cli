; Route all PHP mail() through msmtp to the mail-catching service (the "mailpit"
; container on the compose network, SMTP port 1025). Captured mail is viewable
; at http://localhost:8025. Dev only — no real delivery.
; If you switch back to the mailcatcher service, change --host to "mailcatcher".
; NOTE: do NOT add --auto-from here. It overrides --from and builds the
; envelope sender from the container user+host (e.g. "root"), which Mailpit
; rejects as an invalid RFC 5321 address (553 5.1.3).
sendmail_path = "/usr/bin/msmtp -t --host=mailpit --port=1025 --tls=off --from=wordpress@stacker.test"
